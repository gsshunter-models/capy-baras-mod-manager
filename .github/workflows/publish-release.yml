name: Publish app release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml

permissions:
  contents: read

concurrency:
  group: publish-v1.4.5
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gsshunter-models/capy-baras-mod-manager' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test and build v1.4.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-ReleaseDotnet([string]$Label, [string[]]$Arguments) {
            & dotnet @Arguments 2>&1 | Tee-Object -Variable taskLog
            if ($LASTEXITCODE -ne 0) {
              $message = ($taskLog | Select-Object -Last 100 | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=${Label}::$message"
              throw "$Label failed."
            }
          }
          Invoke-ReleaseDotnet 'Core tests' @('run', '--project', 'Tests/MXSimModManager.Tests.csproj', '-c', 'Release')
          Invoke-ReleaseDotnet 'Windows tests' @('run', '--project', 'Tests.Windows/MXSimModManager.WindowsTests.csproj', '-c', 'Release', '-p:BuildInParallel=false')
          Invoke-ReleaseDotnet 'Publish' @('publish', 'Desktop/MXSimModManager.csproj', '-c', 'Release', '--no-self-contained', '-p:BuildInParallel=false', '-o', 'artifacts/CapyBara-Mod-Manager-v1.4.5')
          Copy-Item -LiteralPath README.md -Destination artifacts/CapyBara-Mod-Manager-v1.4.5/README.md
          $version = (Get-Item artifacts/CapyBara-Mod-Manager-v1.4.5/CapyBaraModManager.exe).VersionInfo.FileVersion
          if ($version -ne '1.4.5.0') { throw "Unexpected app version: $version" }
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          $zip = 'artifacts/release/CapyBaraModManager-v1.4.5-windows-portable.zip'
          Compress-Archive -Path artifacts/CapyBara-Mod-Manager-v1.4.5/* -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CapyBaraModManager-v1.4.5-windows-portable.zip" | Set-Content -LiteralPath artifacts/release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Publish v1.4.5 and its download assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v1.4.5
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.4.5 artifacts/release/CapyBaraModManager-v1.4.5-windows-portable.zip artifacts/release/SHA256SUMS.txt --clobber
          } else {
            gh release create v1.4.5 artifacts/release/CapyBaraModManager-v1.4.5-windows-portable.zip artifacts/release/SHA256SUMS.txt --target "$env:RELEASE_TARGET" --title "Capy Bara's Mod Manager v1.4.5" --notes-file docs/releases/v1.4.5.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
